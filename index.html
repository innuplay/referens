<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>referens</title>
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Referens">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
      --text-muted: #999999;
      --accent: #fbbf24;
      --gold: #fbbf24;
      --danger: #ef4444;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-wrapper {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      max-width: 1680px;
      margin: 0 auto;
      gap: 10px;
      overflow: hidden;
    }

    /* Верхняя полоса: заголовок и подсказка */
    header {
      display: none; /* Убираем верхнюю полоску, чтобы не налезала на камеру/чёлку */
    }

    .header-center-pill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 6px 24px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      pointer-events: none;
    }

    .header-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 5;
    }
    .header-hint kbd {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 5px;
      border-radius: 4px;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
    }

    /* Главный двухколоночный экран */
    .main-workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 14px;
    }

    /* Когда открыта вкладка "♥" (избранное) - скрываем нижнюю/правую доску референсов */
    .main-workspace.favorites-mode {
      grid-template-columns: 1fr !important;
      grid-template-rows: 1fr !important;
    }
    .main-workspace.favorites-mode .board-panel {
      display: none !important;
    }

    /* ==========================================================
       ЛЕВАЯ ПАНЕЛЬ: Вкладки альбома (фото, эмоция, одежда, предметы, образы)
       ========================================================== */
    .album-panel {
      background: #11141d;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .album-tabs-bar {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #0d0f16;
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
    }
    .album-tabs-bar::-webkit-scrollbar {
      height: 4px;
    }
    .album-tabs-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .tab-btn.active {
      border-color: var(--gold);
      color: #000;
      background: var(--gold);
      box-shadow: 0 2px 10px rgba(251, 191, 36, 0.4);
    }
    .tab-btn.tab-favorites {
      color: #f43f5e;
      font-size: 1.05rem;
      padding: 5px 12px;
    }
    .tab-btn.tab-favorites.active {
      border-color: #f43f5e;
      color: #fff;
      background: #f43f5e;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.4);
    }
    .tab-count {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .tab-btn.active .tab-count {
      background: #fbbf24;
      color: #000;
    }

    .tab-header-info {
      flex-shrink: 0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
    }
    .tab-title-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
    }

    .plus-paste-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 9px;
      background: rgba(251, 191, 36, 0.15);
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      color: #fbbf24;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.15);
    }
    .plus-paste-btn:hover {
      background: rgba(251, 191, 36, 0.28);
      color: #fff;
      transform: scale(1.05);
    }
    .plus-paste-btn:active {
      transform: scale(0.92);
    }
    .paste-clip-btn.url-btn {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
    }
    .paste-clip-btn.url-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .icon-action-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .icon-action-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }
    .icon-action-btn:active {
      transform: scale(0.92);
    }
    .add-photo-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .add-photo-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .album-grid-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 10px;
      align-content: start;
      cursor: zoom-in;
    }
    .album-grid-container::-webkit-scrollbar {
      width: 6px;
    }
    .album-grid-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    .fav-composition-preview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      width: 100%;
      height: 100%;
      background: #090a0f;
      padding: 2px;
      box-sizing: border-box;
    }
    .fav-composition-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 4px;
    }
    .photo-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #090a0f;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .photo-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .photo-card.on-board {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Значок-галочка/пин в углу фото (добавляет/убирает с доски) - внизу справа, компактный */
    .photo-pin-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      z-index: 10;
      backdrop-filter: blur(4px);
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .photo-pin-badge:active {
      transform: scale(0.92);
    }
    .photo-card.on-board .photo-pin-badge {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.6);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
      opacity: 0;
      transition: opacity 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      pointer-events: none; /* чтобы клики сквозь оверлей шли на карточку */
    }
    .photo-card:hover .photo-overlay {
      opacity: 1;
    }
    .photo-actions-top {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      pointer-events: auto;
    }
    .action-btn-mini {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .action-btn-mini:hover {
      background: rgba(239, 68, 68, 0.85);
      border-color: #ef4444;
    }
    .action-btn-mini.zoom-btn:hover {
      background: rgba(251, 191, 36, 0.3);
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .empty-tab-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-muted);
      text-align: center;
      gap: 8px;
    }
    .empty-tab-state b {
      color: #fff;
      font-size: 0.95rem;
    }

    /* ==========================================================
       ПРАВАЯ ПАНЕЛЬ: ДОСКА РЕФЕРЕНСОВ (любое количество картинок)
       ========================================================== */
    .board-panel {
      background: #11141d;
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      position: relative;
    }

    .board-header {
      flex-shrink: 0;
      padding: 10px 14px;
      background: #0d0f16;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .board-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .board-title-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .board-count-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(251, 191, 36, 0.18);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .board-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .board-btn {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .board-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .board-btn.danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Полотно доски (сетка референсов) */
    .board-canvas {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      align-content: start;
      background:
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.02) 0%, transparent 70%),
        #0b0d13;
      cursor: zoom-in;
    }
    .board-canvas::-webkit-scrollbar {
      width: 6px;
    }
    .board-canvas::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.2);
      border-radius: 3px;
    }

    .board-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #141722;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .board-item:hover {
      transform: translateY(-2px);
      border-color: rgba(251, 191, 36, 0.6);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }
    .board-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .board-item-category {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 0.62rem;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      text-transform: capitalize;
      pointer-events: none;
      line-height: 1.2;
    }

    .board-item-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 2;
    }
    .board-item:hover .board-item-remove {
      display: flex;
    }
    .board-item-remove:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .empty-board-notice {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      gap: 10px;
      cursor: default;
    }
    .empty-board-notice h3 {
      font-size: 1.05rem;
      color: #fff;
      font-weight: 700;
    }
    .empty-board-notice p {
      font-size: 0.85rem;
      max-width: 380px;
      line-height: 1.5;
    }

    /* ==========================================================
       ПОЛНОЭКРАННОЕ ОБЪЕДИНЕНИЕ ВСЕХ ОБЪЕКТОВ (PURE REF CANVAS)
       ========================================================== */
    .fullscreen-board-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0f15;
      z-index: 9990;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .fullscreen-board-modal.open {
      display: block;
    }

    /* Верхняя панель управления PureRef */
    .fs-pureref-bar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      left: 14px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 10005;
      pointer-events: none;
    }
    .fs-pureref-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .fs-tool-btn {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      height: 32px;
      padding: 0 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .fs-tool-btn.save-btn {
      background: rgba(251, 191, 36, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }
    .fs-tool-btn.save-btn:hover, .fs-tool-btn.save-btn:active {
      background: var(--gold);
      color: #000;
    }
      border-color: var(--gold);
    }
    .fs-floating-close {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s ease;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .fs-floating-close:hover, .fs-floating-close:active {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* Холст бесконечного перемещения PureRef */
    .fs-pureref-viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      background-color: #0b0c10;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .fs-pureref-viewport:active {
      cursor: grabbing;
    }

    .fs-pureref-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* Отдельный элемент на холсте PureRef */
    .fs-ref-card {
      position: absolute;
      touch-action: none;
      cursor: move;
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      transition: box-shadow 0.15s ease;
      transform-origin: top left;
      user-select: none;
    }
    .fs-ref-card:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    }
    .fs-ref-card.selected {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
    }
    .fs-ref-card img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      border-radius: 4px;
      object-fit: contain;
      background: rgba(0,0,0,0.3);
    }

    /* Ручки масштабирования по углам (увеличены для легкого тача на телефоне) */
    .fs-resize-handle {
      position: absolute;
      width: 28px;
      height: 28px;
      background: var(--gold);
      border: 3px solid #000;
      border-radius: 50%;
      z-index: 10;
      touch-action: none;
      opacity: 0.9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .fs-resize-handle:active {
      transform: scale(1.2);
    }
    .fs-resize-handle.br {
      right: -12px;
      bottom: -12px;
      cursor: se-resize;
    }
    .fs-resize-handle.bl {
      left: -12px;
      bottom: -12px;

  <script>
    /* Категории альбома в новом порядке:
       эмоция -> образы -> объект -> предмет -> детали -> favorites (♥)
    */
    const CATEGORIES = {
      emotion: { id: 'emotion', title: 'эмоция' },
      creatures: { id: 'creatures', title: 'образы' },
      people: { id: 'people', title: 'объект' },
      items: { id: 'items', title: 'предмет' },
      spaces: { id: 'spaces', title: 'детали' },
      favorites: { id: 'favorites', title: '♥' }
    };

    let activeTabId = 'emotion';

    // База данных IndexedDB (VisualBoardDB v3)
    const DB_NAME = 'VisualBoardDB';
    const STORE_ITEMS = 'category_items';
    let db = null;

    // Список картинок, выбранных на доску (ID фото)
    let boardItemIds = JSON.parse(localStorage.getItem('user_board_items') || '[]');

    function saveBoardToStorage() {
      localStorage.setItem('user_board_items', JSON.stringify(boardItemIds));
    }

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_ITEMS)) {
            const store = dbInstance.createObjectStore(STORE_ITEMS, { keyPath: 'id' });
            store.createIndex('folderId', 'folderId', { unique: false });
            store.createIndex('createdAt', 'createdAt', { unique: false });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function getFolderItems(folderId) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_ITEMS, 'readonly');
        const store = tx.objectStore(STORE_ITEMS);
        const index = store.index('folderId');
        const req = index.getAll(IDBKeyRange.only(folderId));
        req.onsuccess = () => {
          const items = req.result.sort((a, b) => b.createdAt - a.createdAt);
          resolve(items);
        };
        req.onerror = () => resolve([]);
      });
    }

    async function getItemById(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_ITEMS, 'readonly');
        const store = tx.objectStore(STORE_ITEMS);
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    async function getFolderCount(folderId) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_ITEMS, 'readonly');
        const store = tx.objectStore(STORE_ITEMS);
        const index = store.index('folderId');
        const req = index.count(IDBKeyRange.only(folderId));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(0);
      });
    }

    async function addItemToDB(folderId, imageData) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_ITEMS, 'readwrite');
        const store = tx.objectStore(STORE_ITEMS);
        const record = {
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          folderId: folderId,
          image: imageData,
          createdAt: Date.now()
        };
        store.add(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = (e) => reject(e);
      });
    }

    async function deleteItemFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_ITEMS, 'readwrite');
        const store = tx.objectStore(STORE_ITEMS);
        store.delete(id);
        tx.oncomplete = () => {
          boardItemIds = boardItemIds.filter(x => x !== id);
          saveBoardToStorage();
          resolve();
        };
      });
    }

    // Рендер вкладок альбома
    async function renderTabs() {
      const container = document.getElementById('albumTabsBar');
      let html = '';
      for (const key of Object.keys(CATEGORIES)) {
        const cat = CATEGORIES[key];
        const isActive = (key === activeTabId);
        const isFav = (key === 'favorites');
        html += `
          <button class="tab-btn ${isActive ? 'active' : ''} ${isFav ? 'tab-favorites' : ''}" onclick="switchTab('${key}')" title="${isFav ? 'Сохраненные композиции' : cat.title}">
            <span>${cat.title}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('activeTabTitle').textContent = CATEGORIES[activeTabId].title;
    }

    async function switchTab(tabId) {
      if (Date.now() - lastBoardCloseTime < 450) return;
      activeTabId = tabId;
      const workspace = document.querySelector('.main-workspace');
      if (workspace) {
        if (activeTabId === 'favorites') {
          workspace.classList.add('favorites-mode');
        } else {
          workspace.classList.remove('favorites-mode');
        }
      }
      await renderTabs();
      await renderAlbumGrid();
    }

                </button>

    async function toggleBoardItem(itemId) {
      const idx = boardItemIds.indexOf(itemId);
      if (idx > -1) {
        boardItemIds.splice(idx, 1);
        showToast('Убрано с доски');
      } else {
        if (boardItemIds.length >= 5) {
          showToast('На доске доступно максимум 5 референсов');
          return;
        }
        boardItemIds.push(itemId);
        showToast('Помещено на доску!');
      }
      saveBoardToStorage();
      await renderAlbumGrid();
      await renderBoard();
    }

    // Рендер доски справа
    async function renderBoard() {
      const canvas = document.getElementById('boardCanvas');
      const badge = document.getElementById('boardCountBadge');
      if (badge) badge.textContent = `${boardItemIds.length} на доске`;

      if (boardItemIds.length === 0) {
        canvas.innerHTML = `
          <div class="empty-board-notice">
            <h3>Пусто</h3>
          </div>
        `;
        return;
      }

      let html = '';
      for (const id of boardItemIds) {
        const item = await getItemById(id);
        if (!item) continue;
        const catName = CATEGORIES[item.folderId] ? CATEGORIES[item.folderId].title : '';
        html += `
          <div class="board-item" data-id="${item.id}" onclick="handleBoardItemClick('${item.image}', event)">
            <img src="${item.image}" alt="Реф" loading="lazy">
            ${catName ? `<div class="board-item-category">${catName}</div>` : ''}
            <button class="board-item-remove" title="Убрать с доски" onclick="removeBoardItemOnly('${item.id}', event)">

    // Клик на конкретную картинку на доске -> увеличивается только она
    function handleBoardItemClick(imageSrc, event) {
      event.stopPropagation(); // Не всплывает на пустую доску
      openLightbox(imageSrc, event);
    }

    // Клик на пустое место альбома -> открытие всех картинок текущей категории крупно на холсте
    async function handleAlbumCanvasClick(e) {
      if (e.target.closest('.photo-card') || e.target.closest('.empty-tab-state')) return;
      const items = await getFolderItems(activeTabId);
      if (!items || items.length === 0) return;
      openFullscreenItems(items);
    }

    // Клик на пустое место доски -> все объекты с доски открываются крупно на холсте
    async function handleCanvasClick(e) {
      if (e.target.closest('.board-item') || e.target.closest('.empty-board-notice')) return;
      if (boardItemIds.length === 0) return;
      const count = Math.min(boardItemIds.length, 5);
      const items = [];
      for (let i = 0; i < count; i++) {
        const item = await getItemById(boardItemIds[i]);
        if (item) items.push(item);
      }
      if (items.length === 0) return;
      openFullscreenItems(items);
    }

    // ==========================================================
    // ВСЕ ОБЪЕКТЫ НА ВЕСЬ ЭКРАН: ИНТЕРАКТИВНЫЙ ХОЛСТ PUREREF
    // (Перемещение, зум холста, свободное перемещение и ресайз каждого рефа)
    // ==========================================================
    let pureRefState = {
      panX: 0,
      panY: 0,
      zoom: 1,
      isPanning: false,
      startPanX: 0,
      startPanY: 0,
      cards: [], // { id, x, y, width, height, aspect, el }
      selectedCardId: null,
      activeDrag: null, // { type: 'move'|'resize', cardId, startPointerX, startPointerY, startX, startY, startW, startH, handle, aspect }
      topZIndex: 10
    };

    function loadImageAspect(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 300;
          const h = img.naturalHeight || 300;
          resolve({ ratio: w / h, width: w, height: h });
        };
        img.onerror = () => resolve({ ratio: 1, width: 300, height: 300 });
        img.src = src;
      });
    }

    function updatePureRefWorldTransform() {
      const world = document.getElementById('pureRefWorld');
      if (world) {
        world.style.transform = `translate(${pureRefState.panX}px, ${pureRefState.panY}px) scale(${pureRefState.zoom})`;
      }
    }

    function resetPureRefView() {
      if (pureRefState.cards.length === 0) {
        pureRefState.panX = window.innerWidth / 2;
        pureRefState.panY = window.innerHeight / 2;
        pureRefState.zoom = 1;
        updatePureRefWorldTransform();
        return;
      }

      // Вычисляем охватывающий прямоугольник (bounding box) всех картинок
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      pureRefState.cards.forEach(c => {
        if (c.x < minX) minX = c.x;
        if (c.y < minY) minY = c.y;
        if (c.x + c.width > maxX) maxX = c.x + c.width;
        if (c.y + c.height > maxY) maxY = c.y + c.height;
      });

      const bboxW = (maxX - minX) || 400;
      const bboxH = (maxY - minY) || 400;
      const margin = 80;

      const availW = Math.max(window.innerWidth - margin * 2, 200);
      const availH = Math.max(window.innerHeight - margin * 2, 200);

      const zoom = Math.min(availW / bboxW, availH / bboxH, 1.6);
      pureRefState.zoom = Math.max(0.2, zoom);

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;

      pureRefState.panX = window.innerWidth / 2 - centerX * pureRefState.zoom;
      pureRefState.panY = window.innerHeight / 2 - centerY * pureRefState.zoom;

      updatePureRefWorldTransform();
    }

    function autoLayoutPureRef() {
      if (pureRefState.cards.length === 0) return;
      const count = pureRefState.cards.length;
      const isPortrait = window.innerHeight > window.innerWidth;

      // Крупный базовый размер для каждого изображения
      const baseH = isPortrait ? 400 : 480;
      const gap = 18;

      if (count <= 2) {
        // 1-2 картинки: в один ряд или колонку крупно
        let currentX = 0;
        let currentY = 0;
        pureRefState.cards.forEach((c) => {
          const w = Math.round(baseH * c.aspect);
          c.width = w;
          c.height = baseH;
          if (isPortrait && count === 2) {
            c.x = 0;
            c.y = currentY;
            currentY += baseH + gap;
          } else {
            c.x = currentX;
            c.y = 0;
            currentX += w + gap;
          }
          applyCardStyles(c);
        });
      } else if (count === 3) {
        if (isPortrait) {
          // Верхняя 1 крупная, снизу 2 рядом
          const topCard = pureRefState.cards[0];
          const topH = Math.round(baseH * 1.1);
          topCard.width = Math.round(topH * topCard.aspect);
          topCard.height = topH;
          topCard.x = 0;
          topCard.y = 0;
          applyCardStyles(topCard);

          let btmX = 0;
          for (let i = 1; i < 3; i++) {
            const c = pureRefState.cards[i];
            const w = Math.round(baseH * c.aspect);
            c.width = w;
            c.height = baseH;
            c.x = btmX;
            c.y = topH + gap;
            btmX += w + gap;
            applyCardStyles(c);
          }
        } else {
          // В альбомном режиме: все 3 крупно в ряд
          let currentX = 0;
          pureRefState.cards.forEach((c) => {
            const w = Math.round(baseH * c.aspect);
            c.width = w;
            c.height = baseH;
            c.x = currentX;
            c.y = 0;
            currentX += w + gap;
            applyCardStyles(c);
          });
        }
      }
      } else if (count === 4) {
        // Сетка 2x2 крупно и аккуратно
        const row1Cards = [pureRefState.cards[0], pureRefState.cards[1]];
        const row2Cards = [pureRefState.cards[2], pureRefState.cards[3]];

        let r1X = 0;
        row1Cards.forEach(c => {
          const w = Math.round(baseH * c.aspect);
          c.width = w;
          c.height = baseH;
          c.x = r1X;
          c.y = 0;
          r1X += w + gap;
          applyCardStyles(c);
        });

        let r2X = 0;
        row2Cards.forEach(c => {
          const w = Math.round(baseH * c.aspect);
          c.width = w;
          c.height = baseH;
          c.x = r2X;
          c.y = baseH + gap;
          r2X += w + gap;
          applyCardStyles(c);
        });
      } else {
        // 5 картинок: верхний ряд (2) и нижний ряд (3)
        const row1Count = isPortrait ? 2 : 3;
        const row1 = pureRefState.cards.slice(0, row1Count);
        const row2 = pureRefState.cards.slice(row1Count);

        let r1X = 0;
        row1.forEach(c => {
          const w = Math.round(baseH * c.aspect);
          c.width = w;
          c.height = baseH;
          c.x = r1X;
          c.y = 0;
          r1X += w + gap;
          applyCardStyles(c);
        });

        let r2X = 0;
        row2.forEach(c => {
          const w = Math.round(baseH * c.aspect);
          c.width = w;
          c.height = baseH;
          c.x = r2X;
          c.y = baseH + gap;
          r2X += w + gap;
          applyCardStyles(c);
        });
      }

      resetPureRefView();
      showToast('Упорядочено');
    }

    // Сохранение скрепленной композиции в ячейку с сердечком (favorites)
    async function savePureRefComposition() {
      if (pureRefState.cards.length === 0) {
        showToast('На доске нет изображений');
        return;
      }

      showToast('Создаем скрепленный референс...');

      try {
        // 1. Вычисляем точные границы композиции
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        pureRefState.cards.forEach(c => {
          if (c.x < minX) minX = c.x;
          if (c.y < minY) minY = c.y;
          if (c.x + c.width > maxX) maxX = c.x + c.width;
          if (c.y + c.height > maxY) maxY = c.y + c.height;
        });

        const compW = (maxX - minX);
        const compH = (maxY - minY);
        if (compW <= 0 || compH <= 0) return;

        // 2. Рендерим композицию на Canvas с максимальным качеством
        const canvas = document.createElement('canvas');
        // Ограничиваем максимальный размер холста для быстродействия
        const scale = Math.min(1.5, 2400 / Math.max(compW, compH));
        canvas.width = Math.round(compW * scale);
        canvas.height = Math.round(compH * scale);
        const ctx = canvas.getContext('2d');

        // Тёмный фон как в PureRef
        ctx.fillStyle = '#0b0c10';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Сортируем карточки по zIndex, чтобы соблюсти порядок наложения
        const sortedCards = [...pureRefState.cards].sort((a, b) => {
          const zA = parseInt(a.el.style.zIndex || 0, 10);
          const zB = parseInt(b.el.style.zIndex || 0, 10);
          return zA - zB;
        });

        for (const card of sortedCards) {
          const img = card.el.querySelector('img');
          if (img && img.src) {
            await new Promise((resolve) => {
              const drawImg = new Image();
              drawImg.crossOrigin = 'anonymous';
              drawImg.onload = () => {
                const drawX = Math.round((card.x - minX) * scale);
                const drawY = Math.round((card.y - minY) * scale);
                const drawW = Math.round(card.width * scale);
                const drawH = Math.round(card.height * scale);
                ctx.drawImage(drawImg, drawX, drawY, drawW, drawH);
                resolve();
              };
              drawImg.onerror = () => resolve();
              drawImg.src = img.src;
            });
          }
        }

        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

        // 3. Сохраняем в папку "favorites" (ячейка с сердечком ♥)
        await addItemToDB('favorites', dataUrl);
        await renderTabs();
        await renderAlbumGrid();

        showToast('Сохранено в ♥ (избранное)!');
      } catch (err) {
        console.error('Error saving composition:', err);
        showToast('Не удалось сохранить композицию');
      }
    }

    function applyCardStyles(card) {
      if (!card.el) return;
      card.el.style.left = `${card.x}px`;
      card.el.style.top = `${card.y}px`;
      card.el.style.width = `${card.width}px`;
      card.el.style.height = `${card.height}px`;
    }

    async function openFullscreenItems(itemsList) {
      if (!itemsList || itemsList.length === 0) return;

      const modal = document.getElementById('fullscreenBoardModal');
      const world = document.getElementById('pureRefWorld');

      world.innerHTML = '';
      pureRefState.cards = [];
      pureRefState.selectedCardId = null;
      pureRefState.topZIndex = 10;

      // Загружаем данные референсов
      const loadedItems = [];
      for (let i = 0; i < itemsList.length; i++) {
        const item = itemsList[i];
        if (item) {
          const aspectData = await loadImageAspect(item.image);
          loadedItems.push({ item, aspectData });
        }
      }

      if (loadedItems.length === 0) return;

      // Размещение в стиле PureRef
      const isPortrait = window.innerHeight > window.innerWidth;
      const baseHeight = isPortrait ? 380 : 440;
      const gap = 18;
      let currentX = 0;

      loadedItems.forEach(({ item, aspectData }, idx) => {
        const aspect = aspectData.ratio || 1;
        const w = Math.round(baseHeight * aspect);
        const h = baseHeight;

        const cardEl = document.createElement('div');
        cardEl.className = 'fs-ref-card';
        cardEl.dataset.id = item.id;
        cardEl.style.zIndex = 10 + idx;

        const imgEl = document.createElement('img');
        imgEl.src = item.image;
        imgEl.alt = 'референс';
        cardEl.appendChild(imgEl);

        // Ручки изменения размера по 4 углам
        ['br', 'bl', 'tr', 'tl'].forEach(pos => {
          const handle = document.createElement('div');
          handle.className = `fs-resize-handle ${pos}`;
          handle.dataset.handle = pos;
          cardEl.appendChild(handle);
        });

        const cardObj = {
          id: item.id,
          x: currentX,
          y: 0,
          width: w,
          height: h,
          aspect: aspect,
          el: cardEl
        };

        pureRefState.cards.push(cardObj);
        applyCardStyles(cardObj);
        world.appendChild(cardEl);

        currentX += w + gap;
      });

      modal.classList.add('open');
      initPureRefEvents();
      autoLayoutPureRef();
    }

    async function openFullscreenBoard() {
      if (boardItemIds.length === 0) return;
      const count = Math.min(boardItemIds.length, 5);
      const items = [];
      for (let i = 0; i < count; i++) {
        const item = await getItemById(boardItemIds[i]);
        if (item) items.push(item);
      }
      openFullscreenItems(items);
    }

    let lastBoardCloseTime = 0;
    function closeFullscreenBoard(event) {
      if (event) {
        if (event.preventDefault) event.preventDefault();
        event.stopPropagation();
      }
      lastBoardCloseTime = Date.now();
      const modal = document.getElementById('fullscreenBoardModal');
      modal.classList.remove('open');
    }

    // Инициализация обработчиков мыши и тача для PureRef
    let pureRefEventsInitialized = false;
    function initPureRefEvents() {
      if (pureRefEventsInitialized) return;
      pureRefEventsInitialized = true;

      const viewport = document.getElementById('pureRefViewport');
      let activePointers = new Map();
      let initialPinchDistance = null;
      let initialPinchZoom = null;

      // Закрытие по Escape
      window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('fullscreenBoardModal');
        if (e.key === 'Escape' && modal.classList.contains('open')) {
          closeFullscreenBoard();
        }
      });

      // Зум колёсиком мыши к точке курсора (PureRef zoom)
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        const oldZoom = pureRefState.zoom;
        const newZoom = Math.min(Math.max(oldZoom * zoomFactor, 0.1), 5);

        // Зум относительно точки курсора
        pureRefState.panX = mouseX - (mouseX - pureRefState.panX) * (newZoom / oldZoom);
        pureRefState.panY = mouseY - (mouseY - pureRefState.panY) * (newZoom / oldZoom);
        pureRefState.zoom = newZoom;

        updatePureRefWorldTransform();
      }, { passive: false });

      // Запрет контекстного меню на вьюпорте (ПКМ используется для панорамирования)
      viewport.addEventListener('contextmenu', (e) => e.preventDefault());

      // PointerDown
      viewport.addEventListener('pointerdown', (e) => {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Если коснулись двумя пальцами:
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

          // Проверяем: коснулись ли двумя пальцами одного выбранного изображения?
          const cardEl = e.target.closest('.fs-ref-card');
          const targetCard = cardEl ? pureRefState.cards.find(c => c.id === cardEl.dataset.id) : (pureRefState.selectedCardId ? pureRefState.cards.find(c => c.id === pureRefState.selectedCardId) : null);

          if (targetCard) {
            // Режим масштабирования отдельной картинки двумя пальцами
            pureRefState.isPanning = false;
            pureRefState.activeDrag = {
              type: 'pinch-card',
              cardId: targetCard.id,
              initialDist: initialPinchDistance,
              startW: targetCard.width,
              startH: targetCard.height,
              startX: targetCard.x,
              startY: targetCard.y,
              aspect: targetCard.aspect
            };
          } else {
            // Режим зума всего холста двумя пальцами
            pureRefState.isPanning = false;
            pureRefState.activeDrag = null;
            initialPinchZoom = pureRefState.zoom;
          }
          return;
        }

        // Проверяем, кликнули ли по ручке изменения размера (1 палец / мышь)
        const handleEl = e.target.closest('.fs-resize-handle');
        if (handleEl) {
          e.stopPropagation();
          const cardEl = handleEl.closest('.fs-ref-card');
          const card = pureRefState.cards.find(c => c.id === cardEl.dataset.id);
          if (card) {
            pureRefState.topZIndex++;
            card.el.style.zIndex = pureRefState.topZIndex;
            pureRefState.selectedCardId = card.id;
            updateCardsSelection();

            pureRefState.activeDrag = {
              type: 'resize',
              cardId: card.id,
              handle: handleEl.dataset.handle,
              startPointerX: e.clientX,
              startPointerY: e.clientY,
              startX: card.x,
              startY: card.y,
              startW: card.width,
              startH: card.height,
              aspect: card.aspect
            };
            handleEl.setPointerCapture(e.pointerId);
          }
          return;
        }

        // Проверяем, кликнули ли по самой карточке референса (1 палец -> перетаскивание)
        const cardEl = e.target.closest('.fs-ref-card');
        if (cardEl && e.button !== 2) {
          e.stopPropagation();
          const card = pureRefState.cards.find(c => c.id === cardEl.dataset.id);
          if (card) {
            pureRefState.topZIndex++;
            card.el.style.zIndex = pureRefState.topZIndex;
            pureRefState.selectedCardId = card.id;
            updateCardsSelection();

            pureRefState.activeDrag = {
              type: 'move',
              cardId: card.id,
              startPointerX: e.clientX,
              startPointerY: e.clientY,
              startX: card.x,
              startY: card.y
            };
            cardEl.setPointerCapture(e.pointerId);
          }
          return;
        }

        // Клик по фону (или ПКМ / средняя кнопка мыши) -> панорамирование холста
        if (activePointers.size === 1) {
          pureRefState.isPanning = true;
          pureRefState.startPanX = e.clientX - pureRefState.panX;
          pureRefState.startPanY = e.clientY - pureRefState.panY;
          pureRefState.selectedCardId = null;
          updateCardsSelection();
          viewport.setPointerCapture(e.pointerId);
        }
      });

      // PointerMove
      viewport.addEventListener('pointermove', (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }

        // Двухпальцевый жест
        if (activePointers.size === 2 && initialPinchDistance) {
          const pts = Array.from(activePointers.values());
          const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (curDist <= 0) return;

          // Вариант А: масштабирование отдельной картинки двумя пальцами
          if (pureRefState.activeDrag && pureRefState.activeDrag.type === 'pinch-card') {
            const drag = pureRefState.activeDrag;
            const card = pureRefState.cards.find(c => c.id === drag.cardId);
            if (card) {
              const scaleRatio = curDist / drag.initialDist;
              const newW = Math.max(80, Math.round(drag.startW * scaleRatio));
              const newH = Math.round(newW / drag.aspect);

              // Масштабируем от центра картинки, чтобы она не улетала и не дергалась
              card.x = Math.round(drag.startX - (newW - drag.startW) / 2);
              card.y = Math.round(drag.startY - (newH - drag.startH) / 2);
              card.width = newW;
              card.height = newH;
              applyCardStyles(card);
            }
            return;
          }

          // Вариант Б: масштабирование всего холста (когда пальцы на пустом месте)
          if (initialPinchZoom) {
            const midX = (pts[0].x + pts[1].x) / 2;
            const midY = (pts[0].y + pts[1].y) / 2;

            const ratio = curDist / initialPinchDistance;
            const newZoom = Math.min(Math.max(initialPinchZoom * ratio, 0.1), 5);
            const oldZoom = pureRefState.zoom;

            pureRefState.panX = midX - (midX - pureRefState.panX) * (newZoom / oldZoom);
            pureRefState.panY = midY - (midY - pureRefState.panY) * (newZoom / oldZoom);
            pureRefState.zoom = newZoom;

            updatePureRefWorldTransform();
            return;
          }
        }

        // Перетаскивание или изменение размера отдельного референса одним пальцем / мышью
        if (pureRefState.activeDrag && pureRefState.activeDrag.type !== 'pinch-card') {
          const drag = pureRefState.activeDrag;
          const card = pureRefState.cards.find(c => c.id === drag.cardId);
          if (!card) return;

          const dx = (e.clientX - drag.startPointerX) / pureRefState.zoom;
          const dy = (e.clientY - drag.startPointerY) / pureRefState.zoom;

          if (drag.type === 'move') {
            card.x = Math.round(drag.startX + dx);
            card.y = Math.round(drag.startY + dy);
            applyCardStyles(card);
          } else if (drag.type === 'resize') {
            // Сохраняем пропорции картинки при изменении размера
            const handle = drag.handle;
            let newW = drag.startW;

            if (handle === 'br') {
              newW = Math.max(80, drag.startW + dx);
              card.width = Math.round(newW);
              card.height = Math.round(newW / drag.aspect);
            } else if (handle === 'tr') {
              newW = Math.max(80, drag.startW + dx);
              const newH = Math.round(newW / drag.aspect);
              card.y = Math.round(drag.startY + (drag.startH - newH));
              card.width = Math.round(newW);
              card.height = newH;
            } else if (handle === 'bl') {
              newW = Math.max(80, drag.startW - dx);
              const newH = Math.round(newW / drag.aspect);
              card.x = Math.round(drag.startX + (drag.startW - newW));
              card.width = Math.round(newW);
              card.height = newH;
            } else if (handle === 'tl') {
              newW = Math.max(80, drag.startW - dx);
              const newH = Math.round(newW / drag.aspect);
              card.x = Math.round(drag.startX + (drag.startW - newW));
              card.y = Math.round(drag.startY + (drag.startH - newH));
              card.width = Math.round(newW);
              card.height = newH;
            }
            applyCardStyles(card);
          }
          return;
        }

        // Панорамирование всего холста
        if (pureRefState.isPanning) {
          pureRefState.panX = e.clientX - pureRefState.startPanX;
          pureRefState.panY = e.clientY - pureRefState.startPanY;
          updatePureRefWorldTransform();
        }
      });

      // PointerUp / Cancel
      const endPointer = (e) => {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          initialPinchDistance = null;
          initialPinchZoom = null;
        }
        if (activePointers.size === 0) {
          pureRefState.isPanning = false;
          pureRefState.activeDrag = null;
        }
      };

      viewport.addEventListener('pointerup', endPointer);
      viewport.addEventListener('pointercancel', endPointer);
    }

      req.onsuccess = () => {

    async function importData(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.items || !Array.isArray(data.items)) {
          showToast('Неверный формат файла');
          return;
        }
        const tx = db.transaction(STORE_ITEMS, 'readwrite');
        const store = tx.objectStore(STORE_ITEMS);
        for (const item of data.items) {
          store.put(item);
        }
        tx.oncomplete = async () => {
          if (Array.isArray(data.boardItemIds)) {
            boardItemIds = data.boardItemIds;
            saveBoardToStorage();
          }
          await renderTabs();
          await renderAlbumGrid();
          await renderBoard();
          showToast(`Импортировано фото: ${data.items.length}!`);

    function optimizeImage(blob) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const maxDim = 1400;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.88));
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(blob);
      });
    }

    async function pasteFromClipboard() {
      try {
        if (!navigator.clipboard) {
          showToast('Буфер обмена недоступен');
          return;
        }

        // 1. Сначала пробуем получить бинарную картинку
        if (navigator.clipboard.read) {
          try {
            const clipboardItems = await navigator.clipboard.read();
            for (const item of clipboardItems) {
              const imageType = item.types.find(type => type.startsWith('image/'));
              if (imageType) {
                const blob = await item.getType(imageType);
                const opt = await optimizeImage(blob);
                await addItemToDB(activeTabId, opt);
                await renderTabs();
                await renderAlbumGrid();
                showToast(`Добавлено во вкладку «${CATEGORIES[activeTabId].title}»!`);
                return;
              }
            }
          } catch (e) {
            console.log('Direct image blob not in clipboard or restricted, checking text url...');
          }
        }

        // 2. Если в буфере ссылка (напрямую на картинку или на пин pin.it / pinterest.com)
        if (navigator.clipboard.readText) {
          const text = (await navigator.clipboard.readText() || '').trim();
          if (text && (text.startsWith('http://') || text.startsWith('https://'))) {
            try {
              showToast('Загружаем фото из ссылки...');
              const opt = await optimizeImageUrl(text);
              await addItemToDB(activeTabId, opt);
              await renderTabs();
              await renderAlbumGrid();
              showToast(`Добавлено во вкладку «${CATEGORIES[activeTabId].title}»!`);
              return;
            } catch (err) {
              console.log('Direct image/pin url fetch failed:', err);
            }
          }
        }

        showToast('В буфере обмена нет картинки или ссылки');
      } catch (err) {
        showToast('Нажмите «По ссылке» или разрешите доступ к буферу');
      }
    }

    async function resolveImageUrl(inputUrl) {
      let url = inputUrl.trim();

      // Если это короткая или обычная ссылка на Pinterest (pin.it / pinterest.com/pin/)
      if (url.includes('pin.it') || url.includes('pinterest.com')) {
        try {
          // Используем бесплатный CORS прокси allorigins, чтобы прочитать HTML страницы пина
          const api = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
          const res = await fetch(api);
          const data = await res.json();
          if (data && data.contents) {
            // Ищем в HTML ссылку на оригинал или крупное фото i.pinimg.com
            const matchOrig = data.contents.match(/https:\/\/i\.pinimg\.com\/originals\/[^\s"'\\]+\.(jpg|jpeg|png|webp)/i)
                           || data.contents.match(/https:\/\/i\.pinimg\.com\/1200x\/[^\s"'\\]+\.(jpg|jpeg|png|webp)/i)
                           || data.contents.match(/https:\/\/i\.pinimg\.com\/736x\/[^\s"'\\]+\.(jpg|jpeg|png|webp)/i)
                           || data.contents.match(/https:\/\/i\.pinimg\.com\/[^\s"'\\]+\.(jpg|jpeg|png|webp)/i);
            if (matchOrig && matchOrig[0]) {
              return matchOrig[0].replace(/\\/g, '');
            }
          }
        } catch (e) {
          console.log('Failed to parse pin page via allorigins, trying direct...', e);
        }
      }

      return url;
    }

    async function optimizeImageUrl(rawUrl) {
      const targetUrl = await resolveImageUrl(rawUrl);

      return new Promise((resolve, reject) => {
        // Прокси для обхода CORS защиты сайтов
        const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(targetUrl) + '&output=jpg&q=88';

        const tryLoad = (srcToLoad, isFallback) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            let { width, height } = img;
            const maxDim = 1400;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            try {
              resolve(canvas.toDataURL('image/jpeg', 0.88));
            } catch (e) {
              if (!isFallback) tryLoad(targetUrl, true);
              else reject(e);
            }
          };
          img.onerror = () => {
            if (!isFallback) {
              tryLoad(targetUrl, true);
            } else {
              reject(new Error('Image load failed'));
            }
          };
          img.src = srcToLoad;
        };

        tryLoad(proxyUrl, false);
      });
    }

    async function executeSearch() {
      const input = document.getElementById('searchInput');
      const query = (input.value || '').trim();
      const grid = document.getElementById('searchResultsGrid');

      if (!query) {
        grid.innerHTML = '<div class="search-empty-state"><span>Введите поисковый запрос</span></div>';
        return;
      }

      grid.innerHTML = '<div class="search-empty-state"><span>Ищем изображения...</span></div>';

      try {
        // Формируем список запросов и эндпоинтов для надежного параллельного поиска
        const endpoints = [];

        // 1. Прямой поиск в русской Википедии/Викискладе (отлично работает для запросов на русском)
        endpoints.push(`https://ru.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|mime&iiurlwidth=500&format=json`);

        // 2. Поиск в глобальном Wikimedia Commons по оригинальному запросу
        endpoints.push(`https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|mime&iiurlwidth=500&format=json`);

        // 3. Если в запросе есть кириллица, переводим на английский для поиска по международным базам
        let englishQuery = '';
        if (/[а-яё]/i.test(query)) {
          try {
            const trRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(query)}`);
            if (trRes.ok) {
              const trData = await trRes.json();
              if (trData && trData[0] && trData[0][0] && trData[0][0][0]) {
                englishQuery = trData[0][0][0].trim();
                endpoints.push(`https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(englishQuery)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|mime&iiurlwidth=500&format=json`);
                endpoints.push(`https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(englishQuery)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|mime&iiurlwidth=500&format=json`);
              }
            }
          } catch (trErr) {
            console.log('Optional translation skipped:', trErr);
          }
        } else {
          englishQuery = query;
        }

        // 4. Поиск артов и иллюстраций в базе Safebooru (аниме, 2D арт, концепты персонажей)
        const booruTag = (englishQuery || query).toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/_+/g, '_').trim();
        let booruPromise = null;
        if (booruTag) {
          booruPromise = fetch(`https://safebooru.org/index.php?page=dapi&s=post&q=index&json=1&limit=25&tags=${encodeURIComponent(booruTag)}`)
            .then(r => r.json())
            .catch(() => []);
        }

        // Запускаем запросы безопасно через allSettled
        const results = await Promise.allSettled(
          endpoints.map(u => fetch(u).then(r => r.json()))
        );

        const seenUrls = new Set();
        const validImages = [];

        // Добавляем результаты из Safebooru (персонажи, концепты, 2D)
        if (booruPromise) {
          try {
            const booruItems = await booruPromise;
            if (Array.isArray(booruItems)) {
              for (const b of booruItems) {
                const thumb = b.preview_url || b.sample_url || b.file_url;
                const full = b.sample_url || b.file_url || thumb;
                if (thumb && full && !seenUrls.has(full)) {
                  seenUrls.add(full);
                  validImages.push({ thumb, full, title: b.tags || 'арт' });
                }
              }
            }
          } catch (bErr) {
            console.log('Booru search skipped:', bErr);
          }
        }

        for (const res of results) {
          if (res.status === 'fulfilled' && res.value && res.value.query && res.value.query.pages) {
            const pages = Object.values(res.value.query.pages);
            for (const p of pages) {
              if (p.imageinfo && p.imageinfo[0]) {
                const info = p.imageinfo[0];
                const mime = (info.mime || '').toLowerCase();
                const title = (p.title || '').toLowerCase();
                if (mime.includes('image') && !mime.includes('svg') && !title.endsWith('.pdf')) {
                  const thumb = (info.thumburl || info.url || '').replace('^//', 'https://');
                  const full = (info.url || thumb).replace('^//', 'https://');
                  const safeThumb = thumb.startsWith('//') ? 'https:' + thumb : thumb;
                  const safeFull = full.startsWith('//') ? 'https:' + full : full;

                  if (safeThumb && !seenUrls.has(safeFull)) {
                    seenUrls.add(safeFull);
                    validImages.push({ thumb: safeThumb, full: safeFull, title: p.title || 'референс' });
                  }
                }
              }
            }
          }
        }

        if (validImages.length === 0) {
          grid.innerHTML = '<div class="search-empty-state"><span>Ничего не найдено. Попробуйте другое слово</span></div>';
          return;
        }

        grid.innerHTML = '';
        validImages.forEach(imgData => {
          const item = document.createElement('div');
          item.className = 'search-result-item';

          // Картинка референса
          const imgEl = document.createElement('img');
          imgEl.src = imgData.thumb;
          imgEl.alt = 'референс';
          imgEl.loading = 'lazy';
          item.appendChild(imgEl);

          // Кнопка "+"
          const addBtn = document.createElement('div');
          addBtn.className = 'search-result-add-badge';
          addBtn.innerHTML = '+';
          addBtn.title = 'Выбрать категорию для добавления';

          // Выпадающее меню категорий
          const catMenu = document.createElement('div');
          catMenu.className = 'search-cat-picker-menu';
          catMenu.style.display = 'none';

          // 5 категорий приложения
          const cats = [
            { id: 'emotion', label: 'эмоция' },
            { id: 'creatures', label: 'образы' },
            { id: 'people', label: 'объект' },
            { id: 'items', label: 'предмет' },
            { id: 'spaces', label: 'детали' }
          ];

          cats.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'search-cat-picker-btn';
            btn.type = 'button';
            btn.textContent = c.label;
            btn.onclick = async (e) => {
              e.stopPropagation();
              catMenu.style.display = 'none';
              try {
                showToast(`Сохраняем в «${c.label}»...`);
                const opt = await optimizeImageUrl(imgData.full);
                await addItemToDB(c.id, opt);
                await renderTabs();
                await renderAlbumGrid();
                showToast(`Добавлено в «${c.label}»!`);
              } catch (saveErr) {
                console.error(saveErr);
                showToast('Не удалось загрузить это изображение');
              }
            };
            catMenu.appendChild(btn);
          });

          // Клик по плюсу открывает/закрывает список категорий
          addBtn.onclick = (e) => {
            e.stopPropagation();
            const isOpen = catMenu.style.display === 'flex';
            // Закрываем все другие открытые меню в поиске
            document.querySelectorAll('.search-cat-picker-menu').forEach(m => m.style.display = 'none');
            if (!isOpen) {
              catMenu.style.display = 'flex';
            }
          };

          // Клик по самой карточке сохраняет в текущую активную вкладку
          item.onclick = async () => {
            // Если меню открыто, просто закрываем его
            if (catMenu.style.display === 'flex') {
              catMenu.style.display = 'none';
              return;
            }
            try {
              showToast(`Сохраняем в «${CATEGORIES[activeTabId].title}»...`);
              const opt = await optimizeImageUrl(imgData.full);
              await addItemToDB(activeTabId, opt);
              await renderTabs();
              await renderAlbumGrid();
              showToast(`Добавлено в «${CATEGORIES[activeTabId].title}»!`);
            } catch (err) {
              console.error(err);
              showToast('Не удалось загрузить это изображение');
            }
          };

          item.appendChild(addBtn);
          item.appendChild(catMenu);
          grid.appendChild(item);
        });

      } catch (err) {
        console.error('Search error:', err);
        grid.innerHTML = '<div class="search-empty-state"><span>Ошибка при поиске. Проверьте запрос</span></div>';
      }
    }

    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = message;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    async function init() {
      await initDB();

      // Автоматическая загрузка картинок из GitHub при первом запуске сайта
      if (window.PRELOADED_DATA && window.PRELOADED_DATA.items) {
        const hasLoadedKey = 'referens_preloaded_v1';
        if (!localStorage.getItem(hasLoadedKey)) {
          const tx = db.transaction(STORE_ITEMS, 'readwrite');
          const store = tx.objectStore(STORE_ITEMS);
          for (const item of window.PRELOADED_DATA.items) {
            store.put(item);
          }
          await new Promise((res) => { tx.oncomplete = res; });
          if (Array.isArray(window.PRELOADED_DATA.boardItemIds)) {
            boardItemIds = window.PRELOADED_DATA.boardItemIds;
            saveBoardToStorage();
          }
          localStorage.setItem(hasLoadedKey, 'true');
        }
      }

      await renderTabs();
      await renderAlbumGrid();
      await renderBoard();

      // Регистрация Service Worker для PWA (работа офлайн и установка как приложение)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration error:', err);
        });
      }
    }

    window.onload = init;
  </script>
</body>
</html>
